<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tool-kind colors</title>
<link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="card-root">
  <div class="label">Tool-kind colors · agent activity</div>
  <div class="row">
    <div class="swatch bg-text" style="background:var(--success)"><div class="name">read</div><div class="hex">--success</div></div>
    <div class="swatch bg-text" style="background:var(--info)"><div class="name">edit</div><div class="hex">--info</div></div>
    <div class="swatch bg-text" style="background:var(--warning)"><div class="name">execute</div><div class="hex">--warning</div></div>
    <div class="swatch bg-text" style="background:var(--tool-web)"><div class="name">fetch</div><div class="hex">--tool-web</div></div>
    <div class="swatch bg-text" style="background:var(--tool-search)"><div class="name">browser</div><div class="hex">--tool-search</div></div>
    <div class="swatch bg-text" style="background:var(--fg-muted)"><div class="name">other</div><div class="hex">--fg-muted</div></div>
  </div>
  <div class="mono">ScarfToolTone (ScarfComponents.swift): each color is text-safe on its --*-tint chip wash</div>
</div>
</body></html>
